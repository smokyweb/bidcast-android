[versions]

# --- Android / Build ---
agp = "8.13.2"
kotlin = "2.2.0"  # Updated from 2.0.20
kotlinxMetadataJvm = "0.9.0"
ksp = "2.3.4"  # Updated from 2.0.20-1.0.25


# --- AndroidX Core ---
activity = "1.12.2"
appcompat = "1.7.1"
coreKtx = "1.17.0"
annotation = "1.9.1"
legacySupportV4 = "1.0.0"
constraintlayout = "2.2.1"
lifecycleKtx = "2.10.0"
navigationKtx = "2.9.6"
browser = "1.9.0"
coreSplashscreen = "1.2.0"

# --- UI / Material ---
material = "1.11.0" # DO NOT CHANGE
flexbox = "3.0.0"

# --- Media / Images ---
glide = "5.0.5"
glideTransformations = "4.3.0"
androidImageCropper = "4.7.0"
cameraview = "2.7.2"

# --- Media3 ---
media3 = "1.9.0"

# --- Networking ---
retrofit = "3.0.0"
converterGson = "3.0.0"
loggingInterceptor = "5.3.2"
socketIo = "2.1.2"

# --- Async ---
kotlinxCoroutinesCore = "1.10.2"

# --- Firebase (BOM manages versions, but catalog needs refs) ---
firebaseBom = "34.7.0"
firebaseMessaging = "24.1.2"
firebaseDatabase = "22.0.1"
firebaseCrashlytics = "20.0.3"

# --- DI ---
hilt = "2.57.2"

# --- Payments ---
billingKtx = "8.3.0"
stripeAndroid = "22.5.0"

# --- Utilities / UI Widgets ---
androidSpinkit = "1.4.0"
easyvalidationCore = "1.0.4"
expandablelayout = "2.9.2"
decorator = "2.1.0"
numberKeyboard = "3.1.0"
slidetoact = "0.11.0"
powermenu = "2.2.4"
roundedimageview = "2.3.0"
swipelayout = "1.3.1"
toasty = "1.5.2"
recyclerviewAnimators = "4.0.2"
luckywheelview = "1.1.6"
materialCalendarView = "1.9.2"
singledateandtimepicker = "2.2.7"
localeHelperAndroid = "1.5.1"
immersionbar = "3.2.2"
mpandroidchart = "v3.1.0"
advancedcardview = "1.0.1"
arindicatorview = "2.0.0"
htmlTextview = "1.6"
aztec = "v2.1.5"
permissionx = "1.8.1"

# --- Realtime / SDKs ---
agoraFullSdk = "4.6.1"

# --- Google / Firebase Plugins ---
googleGmsGoogleServices = "4.4.4"
crashlytics = "3.0.6"
ui = "1.10.0"


[libraries]

# --- AndroidX Core ---
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
androidx-legacy-support-v4 = { module = "androidx.legacy:legacy-support-v4", version.ref = "legacySupportV4" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }

# --- Lifecycle & Navigation ---
androidx-lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycleKtx" }
androidx-lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycleKtx" }
androidx-navigation-fragment-ktx = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "navigationKtx" }
androidx-navigation-ui-ktx = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "navigationKtx" }

# --- UI / Material ---
kotlinx-metadata-jvm = { module = "org.jetbrains.kotlinx:kotlinx-metadata-jvm", version.ref = "kotlinxMetadataJvm" }
material = { module = "com.google.android.material:material", version.ref = "material" }
flexbox = { module = "com.google.android.flexbox:flexbox", version.ref = "flexbox" }

# --- Media / Images ---
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }
glide-transformations = { module = "jp.wasabeef:glide-transformations", version.ref = "glideTransformations" }
android-image-cropper = { module = "com.vanniktech:android-image-cropper", version.ref = "androidImageCropper" }
cameraview = { module = "com.otaliastudios:cameraview", version.ref = "cameraview" }

# --- Media3 ---
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

# --- Networking ---
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converterGson" }
logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "loggingInterceptor" }
socket-io-client = { module = "io.socket:socket.io-client", version.ref = "socketIo" }

# --- Async ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }

# --- Firebase ---
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-messaging-ktx = { module = "com.google.firebase:firebase-messaging-ktx", version.ref = "firebaseMessaging" }
firebase-database = { module = "com.google.firebase:firebase-database", version.ref = "firebaseDatabase" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics", version.ref = "firebaseCrashlytics" }

# --- Dependency Injection ---
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# --- Payments ---
billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billingKtx" }
stripe-android = { module = "com.stripe:stripe-android", version.ref = "stripeAndroid" }

# --- UI / Utilities ---
android-spinkit = { module = "com.github.ybq:Android-SpinKit", version.ref = "androidSpinkit" }
easyvalidation-core = { module = "com.wajahatkarim:easyvalidation-core", version.ref = "easyvalidationCore" }
expandable-layout = { module = "com.github.cachapa:ExpandableLayout", version.ref = "expandablelayout" }
decorator = { module = "com.rubensousa:decorator", version.ref = "decorator" }
number-keyboard = { module = "com.github.davidmigloz:number-keyboard", version.ref = "numberKeyboard" }
slidetoact = { module = "com.ncorti:slidetoact", version.ref = "slidetoact" }
powermenu = { module = "com.github.skydoves:powermenu", version.ref = "powermenu" }
roundedimageview = { module = "com.makeramen:roundedimageview", version.ref = "roundedimageview" }
swipelayout = { module = "com.github.zerobranch:SwipeLayout", version.ref = "swipelayout" }
toasty = { module = "com.github.GrenderG:Toasty", version.ref = "toasty" }
recyclerview-animators = { module = "jp.wasabeef:recyclerview-animators", version.ref = "recyclerviewAnimators" }
luckywheelview = { module = "com.github.caneryilmaz52:LuckyWheelView", version.ref = "luckywheelview" }
material-calendar-view = { module = "com.applandeo:material-calendar-view", version.ref = "materialCalendarView" }
singledateandtimepicker = { module = "com.github.florent37:singledateandtimepicker", version.ref = "singledateandtimepicker" }
locale-helper-android = { module = "com.zeugmasolutions.localehelper:locale-helper-android", version.ref = "localeHelperAndroid" }
immersionbar = { module = "com.geyifeng.immersionbar:immersionbar", version.ref = "immersionbar" }
immersionbar-ktx = { module = "com.geyifeng.immersionbar:immersionbar-ktx", version.ref = "immersionbar" }
mpandroidchart = { module = "com.github.PhilJay:MPAndroidChart", version.ref = "mpandroidchart" }
advanced-card-view = { module = "com.github.sina-seyfi:AdvancedCardView", version.ref = "advancedcardview" }
arindicatorview = { module = "com.github.martinstamenkovski:ARIndicatorView", version.ref = "arindicatorview" }
html-textview = { module = "com.github.YuanWenHai:html-textview", version.ref = "htmlTextview" }
aztec = { module = "org.wordpress:aztec", version.ref = "aztec" }
permissionx = { module = "com.guolindev.permissionx:permissionx", version.ref = "permissionx" }

# --- SDKs ---
agora-full-sdk = { module = "io.agora.rtc:full-sdk", version.ref = "agoraFullSdk" }
androidx-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "ui" }


[plugins]

androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
